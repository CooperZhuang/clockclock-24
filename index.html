<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)">
<title>ClockClock</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23111'/%3E%3Cpath d='M16 16V5M16 16h8' stroke='%23f5f3ef' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --wall-hi: #f2efe8;
    --wall-lo: #ddd8cf;
    --board: #fdfcf9;
    --face-top: #e0d8cb;
    --face-mid: #efeae2;
    --face-bot: #fcfbf7;
    --ink: #131316;
    --pin: #0b0b0d;
    --rim: rgba(72, 60, 44, 0.14);
    --board-shadow: 0 46px 80px -44px rgba(46, 38, 26, 0.5),
                    0 3px 10px rgba(46, 38, 26, 0.06),
                    0 0 0 1px rgba(46, 38, 26, 0.05);
    --ease: cubic-bezier(0.62, 0.02, 0.28, 1);
    --turn: 900ms;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --wall-hi: #121213;
      --wall-lo: #050506;
      --board: #17171a;
      --face-top: #0c0c0e;
      --face-mid: #131315;
      --face-bot: #1d1d20;
      --ink: #f6f4f0;
      --pin: #fbfaf8;
      --rim: rgba(255, 255, 255, 0.05);
      --board-shadow: 0 46px 90px -40px rgba(0, 0, 0, 0.95),
                      0 0 0 1px rgba(255, 255, 255, 0.04);
    }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(130% 100% at 50% 6%, var(--wall-hi) 0%, var(--wall-hi) 34%, var(--wall-lo) 100%);
    background-color: var(--wall-hi);
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .clock {
    --cell: min(9.7vw, 22.4vh);
    --cell: min(9.7vw, 22.4svh);
    --pad: calc(var(--cell) * 0.38);
    display: grid;
    grid-template-columns: repeat(8, var(--cell));
    grid-template-rows: repeat(3, var(--cell));
    gap: calc(var(--cell) * 0.08);
    padding: var(--pad);
    border-radius: calc(var(--cell) * 0.2);
    background: var(--board);
    box-shadow: var(--board-shadow);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .face {
    position: relative;
    width: var(--cell);
    height: var(--cell);
    border-radius: 50%;
    background: radial-gradient(circle at 50% -22%,
      var(--face-top) 0%,
      var(--face-mid) 46%,
      var(--face-bot) 100%);
    box-shadow:
      inset 0 calc(var(--cell) * 0.02) calc(var(--cell) * 0.045) var(--rim),
      inset 0 calc(var(--cell) * -0.012) calc(var(--cell) * 0.03) rgba(255, 255, 255, 0.25),
      0 1px 0 rgba(255, 255, 255, 0.35);
  }

  .pivot {
    position: absolute;
    inset: 0;
    transform-origin: 50% 50%;
    transition: transform var(--turn) var(--ease);
    will-change: transform;
  }

  .hand {
    position: absolute;
    left: 50%;
    bottom: 50%;
    width: 9.4%;
    height: 47.5%;
    margin-left: -4.7%;
    border-radius: 999px;
    background: var(--ink);
  }

  .pin {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 8%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: var(--pin);
  }

  /* before the first sweep the hands are set without transition */
  .boot .pivot { transition: none; }

  @media (prefers-reduced-motion: reduce) {
    :root { --turn: 240ms; }
  }
</style>
</head>
<body>
  <main class="clock boot" id="clock" role="img" aria-label="ClockClock"></main>

<script>
(() => {
  'use strict';

  // One digit = 2 clocks wide × 3 clocks tall = 6 clocks = 12 hands.
  // A clock only holds two hands, so a glyph never makes a three-way
  // junction: strokes that would need one keep an open half-stem.
  // Angles: 0 = 12 o'clock, 90 = 3 o'clock, clockwise.
  const N = 0, E = 90, S = 180, W = 270, SW = 225;
  const GLYPHS = [
    [[E, S], [S, W], [N, S], [N, S], [N, E], [N, W]], // 0
    [[SW, SW], [S, S], [SW, SW], [N, S], [SW, SW], [N, N]], // 1
    [[E, E], [S, W], [E, S], [N, W], [N, E], [W, W]], // 2
    [[E, E], [S, W], [E, E], [N, W], [E, E], [N, W]], // 3
    [[S, S], [S, S], [N, E], [S, W], [SW, SW], [N, N]], // 4
    [[E, S], [W, W], [N, E], [S, W], [E, E], [N, W]], // 5
    [[E, S], [W, W], [N, S], [S, W], [N, E], [N, W]], // 6
    [[E, E], [S, W], [SW, SW], [N, S], [SW, SW], [N, N]], // 7
    [[E, S], [S, W], [N, E], [N, W], [N, E], [N, W]], // 8
    [[E, S], [S, W], [N, E], [N, S], [E, E], [N, W]]  // 9
  ];

  const COLS = 8, ROWS = 3, FACES = COLS * ROWS;
  const clock = document.getElementById('clock');
  const pivots = [];

  for (let i = 0; i < FACES; i++) {
    const face = document.createElement('div');
    face.className = 'face';
    const pair = [0, 1].map(() => {
      const pivot = document.createElement('div');
      pivot.className = 'pivot';
      pivot.appendChild(Object.assign(document.createElement('i'), { className: 'hand' }));
      face.appendChild(pivot);
      return pivot;
    });
    face.appendChild(Object.assign(document.createElement('b'), { className: 'pin' }));
    clock.appendChild(face);
    pivots.push(pair);
  }

  // clock index for every digit/clock slot: row-major faces, 2 columns per digit
  const faceMap = [0, 1, 2, 3].map((digit) => {
    const slots = [];
    for (let k = 0; k < 6; k++) {
      slots.push(((k / 2) | 0) * COLS + digit * 2 + (k % 2));
    }
    return slots;
  });

  const angle = new Float64Array(FACES * 2);

  function setTime(hhmm, spin) {
    for (let d = 0; d < 4; d++) {
      const glyph = GLYPHS[Number(hhmm[d])];
      const slots = faceMap[d];
      for (let k = 0; k < 6; k++) {
        const index = slots[k];
        for (let h = 0; h < 2; h++) {
          const slot = index * 2 + h;
          const current = ((angle[slot] % 360) + 360) % 360;
          let delta = ((glyph[k][h] - current) % 360 + 360) % 360;
          if (spin) delta += 360;        // every hand always turns clockwise
          angle[slot] += delta;
          pivots[index][h].style.transform = `rotate(${angle[slot]}deg)`;
        }
      }
    }
  }

  const pad = (n) => String(n).padStart(2, '0');
  const stamp = (date) => pad(date.getHours()) + pad(date.getMinutes());

  function paint(date, spin) {
    const time = stamp(date);
    setTime(time, spin);
    const readable = `${time.slice(0, 2)}:${time.slice(2)}`;
    clock.setAttribute('aria-label', `ClockClock ${readable}`);
    document.title = readable;
  }

  const frozen = new URLSearchParams(location.search).get('at');
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  const paused = frozen && /^\d{4}$/.test(frozen);

  let timer = 0;

  function schedule() {
    clearTimeout(timer);
    const now = new Date();
    const wait = 60000 - (now.getSeconds() * 1000 + now.getMilliseconds()) + 20;
    timer = setTimeout(() => {
      paint(new Date(), !still.matches);
      schedule();
    }, wait);
  }

  if (paused) {
    // static frame for screenshots: no transition at all
    paint(new Date(2000, 0, 1, Number(frozen.slice(0, 2)) % 24, Number(frozen.slice(2)) % 60), false);
  } else {
    // boot: every hand starts at twelve, then the whole display sweeps to now
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        clock.classList.remove('boot');
        paint(new Date(), !still.matches);
      });
    });
    schedule();

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clearTimeout(timer);
      } else {
        paint(new Date(), false);
        schedule();
      }
    });
  }
})();
</script>
</body>
</html>
