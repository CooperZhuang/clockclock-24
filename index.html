<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)">
<title>ClockClock</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23111'/%3E%3Cpath d='M16 16V5M16 16h8' stroke='%23f5f3ef' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --wall-hi: #f2efe8;
    --wall-lo: #ddd8cf;
    --board: #fdfcf9;
    --face-top: #e0d8cb;
    --face-mid: #efeae2;
    --face-bot: #fcfbf7;
    --ink: #131316;
    --pin: #0b0b0d;
    --rim: rgba(72, 60, 44, 0.14);
    --board-shadow: 0 46px 80px -44px rgba(46, 38, 26, 0.5),
                    0 3px 10px rgba(46, 38, 26, 0.06),
                    0 0 0 1px rgba(46, 38, 26, 0.05);
    --ease: cubic-bezier(0.62, 0.02, 0.28, 1);
    --turn: 30s;          /* 一圈走完用掉半分钟：0-30s 在转，30-60s 静止 */
    --cell: min(9.7vw, 22.4vh);
    --cell: min(9.7vw, 22.4svh);
    --pad: calc(var(--cell) * 0.38);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --wall-hi: #121213;
      --wall-lo: #050506;
      --board: #17171a;
      --face-top: #0c0c0e;
      --face-mid: #131315;
      --face-bot: #1d1d20;
      --ink: #f6f4f0;
      --pin: #fbfaf8;
      --rim: rgba(255, 255, 255, 0.05);
      --board-shadow: 0 46px 90px -40px rgba(0, 0, 0, 0.95),
                      0 0 0 1px rgba(255, 255, 255, 0.04);
    }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(130% 100% at 50% 6%, var(--wall-hi) 0%, var(--wall-hi) 34%, var(--wall-lo) 100%);
    background-color: var(--wall-hi);
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .stage { position: relative; display: grid; place-items: center; }

  .clock {
    display: grid;
    grid-template-columns: repeat(8, var(--cell));
    grid-template-rows: repeat(3, var(--cell));
    gap: calc(var(--cell) * 0.08);
    padding: var(--pad);
    border-radius: calc(var(--cell) * 0.2);
    background: var(--board);
    box-shadow: var(--board-shadow);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .face {
    position: relative;
    width: var(--cell);
    height: var(--cell);
    border-radius: 50%;
    background: radial-gradient(circle at 50% -22%,
      var(--face-top) 0%,
      var(--face-mid) 46%,
      var(--face-bot) 100%);
    box-shadow:
      inset 0 calc(var(--cell) * 0.02) calc(var(--cell) * 0.045) var(--rim),
      inset 0 calc(var(--cell) * -0.012) calc(var(--cell) * 0.03) rgba(255, 255, 255, 0.25),
      0 1px 0 rgba(255, 255, 255, 0.35);
  }

  .pivot {
    position: absolute;
    inset: 0;
    transform-origin: 50% 50%;
    transition: transform var(--turn) var(--ease);
    will-change: transform;
  }

  .hand {
    position: absolute;
    left: 50%;
    bottom: 50%;
    width: 9.4%;
    height: 47.5%;
    margin-left: -4.7%;
    border-radius: 999px;
    background: var(--ink);
  }

  .pin {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 8%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: var(--pin);
  }

  /* 秒表读数：宽屏时落在面板下沿的内边距里，窄屏时退到面板下方 */
  .timer {
    position: absolute;
    left: 50%;
    top: calc(100% + var(--pad) * 0.5);
    transform: translateX(-50%);
    font: 300 clamp(13px, calc(var(--cell) * 0.22), 110px) / 1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
    color: var(--ink);
    opacity: 0.4;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.2s var(--ease);
  }

  .timer:hover { opacity: 0.66; }
  .timer__cs { margin-left: 0.06em; font-size: 0.62em; opacity: 0.72; }
  .timer[hidden] { display: none; }

  @media (min-width: 780px) and (min-height: 460px) {
    .timer { top: auto; bottom: calc(var(--pad) * 0.16); }
  }

  .toggle {
    position: fixed;
    right: max(14px, env(safe-area-inset-right));
    bottom: max(12px, env(safe-area-inset-bottom));
    padding: 9px;
    border: 0;
    background: none;
    color: var(--ink);
    opacity: 0.28;
    cursor: pointer;
    transition: opacity 0.25s var(--ease);
    -webkit-tap-highlight-color: transparent;
  }

  .toggle:hover,
  .toggle:focus-visible { opacity: 0.85; }
  .toggle[aria-pressed="true"] { opacity: 0.5; }
  .toggle:focus-visible { outline: 1px solid currentColor; outline-offset: 4px; border-radius: 999px; }

  .toggle__track {
    position: relative;
    display: block;
    width: 34px;
    height: 19px;
    border: 1px solid currentColor;
    border-radius: 999px;
  }

  .toggle__knob {
    position: absolute;
    top: 50%;
    left: 3px;
    width: 11px;
    height: 11px;
    margin-top: -5.5px;
    border-radius: 50%;
    background: currentColor;
    transition: transform 0.22s var(--ease);
  }

  .toggle[aria-pressed="true"] .toggle__knob { transform: translateX(15px); }

  /* before the first sweep the hands are set without transition */
  .boot .pivot,
  .no-anim .pivot { transition: none; }

  @media (prefers-reduced-motion: reduce) {
    :root { --turn: 240ms; }
    .toggle__knob { transition: none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <main class="clock boot" id="clock" role="img" aria-label="ClockClock"></main>
    <div class="timer" id="timer" hidden title="点击开始 / 暂停，双击归零">
      <span class="timer__main">00:00</span><span class="timer__cs">.00</span>
    </div>
  </div>

  <button class="toggle" id="toggle" type="button" aria-pressed="false" aria-label="秒表" title="秒表">
    <span class="toggle__track"><span class="toggle__knob"></span></span>
  </button>

<script>
(() => {
  'use strict';

  // One digit = 2 clocks wide × 3 clocks tall = 6 clocks = 12 hands.
  // A clock only holds two hands, so a glyph never makes a three-way
  // junction: strokes that would need one keep an open half-stem.
  // Angles: 0 = 12 o'clock, 90 = 3 o'clock, clockwise.
  const N = 0, E = 90, S = 180, W = 270, SW = 225;
  const GLYPHS = [
    [[E, S], [S, W], [N, S], [N, S], [N, E], [N, W]], // 0
    [[SW, SW], [S, S], [SW, SW], [N, S], [SW, SW], [N, N]], // 1
    [[E, E], [S, W], [E, S], [N, W], [N, E], [W, W]], // 2
    [[E, E], [S, W], [E, E], [N, W], [E, E], [N, W]], // 3
    [[S, S], [S, S], [N, E], [S, W], [SW, SW], [N, N]], // 4
    [[E, S], [W, W], [N, E], [S, W], [E, E], [N, W]], // 5
    [[E, S], [W, W], [N, S], [S, W], [N, E], [N, W]], // 6
    [[E, E], [S, W], [SW, SW], [N, S], [SW, SW], [N, N]], // 7
    [[E, S], [S, W], [N, E], [N, W], [N, E], [N, W]], // 8
    [[E, S], [S, W], [N, E], [N, S], [E, E], [N, W]]  // 9
  ];

  const COLS = 8, ROWS = 3, FACES = COLS * ROWS;
  const clock = document.getElementById('clock');
  const pivots = [];

  for (let i = 0; i < FACES; i++) {
    const face = document.createElement('div');
    face.className = 'face';
    const pair = [0, 1].map(() => {
      const pivot = document.createElement('div');
      pivot.className = 'pivot';
      pivot.appendChild(Object.assign(document.createElement('i'), { className: 'hand' }));
      face.appendChild(pivot);
      return pivot;
    });
    face.appendChild(Object.assign(document.createElement('b'), { className: 'pin' }));
    clock.appendChild(face);
    pivots.push(pair);
  }

  // clock index for every digit/clock slot: row-major faces, 2 columns per digit
  const faceMap = [0, 1, 2, 3].map((digit) => {
    const slots = [];
    for (let k = 0; k < 6; k++) {
      slots.push(((k / 2) | 0) * COLS + digit * 2 + (k % 2));
    }
    return slots;
  });

  const angle = new Float64Array(FACES * 2);

  function setTime(hhmm, spin) {
    for (let d = 0; d < 4; d++) {
      const glyph = GLYPHS[Number(hhmm[d])];
      const slots = faceMap[d];
      for (let k = 0; k < 6; k++) {
        const index = slots[k];
        for (let h = 0; h < 2; h++) {
          const slot = index * 2 + h;
          const current = ((angle[slot] % 360) + 360) % 360;
          let delta = ((glyph[k][h] - current) % 360 + 360) % 360;
          if (spin) delta += 360;        // every hand always turns clockwise
          angle[slot] += delta;
          pivots[index][h].style.transform = `rotate(${angle[slot]}deg)`;
        }
      }
    }
  }

  const pad = (n) => String(n).padStart(2, '0');
  const stamp = (date) => pad(date.getHours()) + pad(date.getMinutes());

  function paint(date, spin) {
    const time = stamp(date);
    setTime(time, spin);
    const readable = `${time.slice(0, 2)}:${time.slice(2)}`;
    clock.setAttribute('aria-label', `ClockClock ${readable}`);
    document.title = readable;
  }

  const params = new URLSearchParams(location.search);
  const frozen = params.get('at');
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  const paused = frozen && /^([01]\d|2[0-3])[0-5]\d$/.test(frozen);   // ?at=HHMM

  // ?turn=<seconds> — how long one whole sweep takes (default 30, i.e. half a minute)
  const turn = Number(params.get('turn'));
  if (turn > 0 && !still.matches) {
    document.documentElement.style.setProperty('--turn', `${Math.min(60, Math.max(0.2, turn))}s`);
  }

  let timer = 0;

  function schedule() {
    clearTimeout(timer);
    const now = new Date();
    const wait = 60000 - (now.getSeconds() * 1000 + now.getMilliseconds()) + 20;
    timer = setTimeout(() => {
      paint(new Date(), !still.matches);
      schedule();
    }, wait);
  }

  if (paused) {
    // static frame for screenshots: no transition at all
    paint(new Date(2000, 0, 1, Number(frozen.slice(0, 2)), Number(frozen.slice(2))), false);
  } else {
    // boot: every hand starts at twelve, then the whole display sweeps to now
    requestAnimationFrame(() => {
      clock.classList.remove('boot');            // transitions become live
      requestAnimationFrame(() => paint(new Date(), !still.matches));
    });
    schedule();

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clearTimeout(timer);
      } else {
        // back from the background: jump instead of spending another half minute turning
        clock.classList.add('no-anim');
        paint(new Date(), false);
        void clock.offsetWidth;
        requestAnimationFrame(() => clock.classList.remove('no-anim'));
        schedule();
      }
    });
  }
  /* ---------- 秒表（开关控制，叠在面板上） ---------- */
  const timerEl = document.getElementById('timer');
  const timerMain = timerEl.querySelector('.timer__main');
  const timerCs = timerEl.querySelector('.timer__cs');
  const toggleEl = document.getElementById('toggle');
  const STORE = 'clockclock.stopwatch';

  let spent = 0;        // ms accumulated while stopped
  let since = 0;        // performance.now() at the last start
  let running = false;
  let rafId = 0;
  let shown = false;

  const pref = {
    // 第一次打开就叠上秒表；之后记住用户自己拨的开关位置
    get() { try { const v = localStorage.getItem(STORE); return v === null ? true : v === '1'; } catch (e) { return true; } },
    set(on) { try { localStorage.setItem(STORE, on ? '1' : '0'); } catch (e) { /* private mode */ } }
  };

  function drawTimer() {
    const cs = Math.floor((spent + (running ? performance.now() - since : 0)) / 10);
    timerMain.textContent =
      String(Math.floor(cs / 6000)).padStart(2, '0') + ':' +
      String(Math.floor(cs / 100) % 60).padStart(2, '0');
    timerCs.textContent = '.' + String(cs % 100).padStart(2, '0');
  }

  function frame() { drawTimer(); rafId = requestAnimationFrame(frame); }

  function startTimer() {
    if (running || !shown) return;
    running = true;
    since = performance.now();
    rafId = requestAnimationFrame(frame);
  }

  function pauseTimer() {
    if (!running) return;
    spent += performance.now() - since;
    running = false;
    cancelAnimationFrame(rafId);
    drawTimer();
  }

  function resetTimer() {
    cancelAnimationFrame(rafId);
    running = false;
    spent = 0;
    drawTimer();
  }

  function showTimer(on) {
    shown = on;
    timerEl.hidden = !on;
    toggleEl.setAttribute('aria-pressed', String(on));
    pref.set(on);
    if (on) { resetTimer(); startTimer(); } else { pauseTimer(); }
  }

  toggleEl.addEventListener('click', () => showTimer(!shown));
  timerEl.addEventListener('click', () => (running ? pauseTimer() : startTimer()));
  timerEl.addEventListener('dblclick', resetTimer);
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const key = e.key.toLowerCase();
    if (key === 's') showTimer(!shown);
    else if (key === ' ' && shown) { e.preventDefault(); running ? pauseTimer() : startTimer(); }
    else if (key === 'r' && shown) resetTimer();
  });

  showTimer(pref.get());
})();
</script>
</body>
</html>
