<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2efe8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)">
<title>ClockClock</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23111'/%3E%3Cpath d='M16 16V5M16 16h8' stroke='%23f5f3ef' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --wall-hi: #f2efe8;
    --wall-lo: #ddd8cf;
    --board: #fdfcf9;
    --face-top: #e0d8cb;
    --face-mid: #efeae2;
    --face-bot: #fcfbf7;
    --ink: #131316;
    --pin: #0b0b0d;
    --rim: rgba(72, 60, 44, 0.14);
    --board-shadow: 0 46px 80px -44px rgba(46, 38, 26, 0.5),
                    0 3px 10px rgba(46, 38, 26, 0.06),
                    0 0 0 1px rgba(46, 38, 26, 0.05);
    --ease: cubic-bezier(0.62, 0.02, 0.28, 1);

    /* 时:分 换字用 15s 慢慢转；秒位每 1s 转 0.8s、停 0.2s */
    --turn-min: 15s;
    --turn-sec: 0.8s;

    --cell: min(6.7vw, 22.4vh);
    --cell: min(6.7vw, 22.4svh);
    --pad: calc(var(--cell) * 0.38);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --wall-hi: #121213;
      --wall-lo: #050506;
      --board: #17171a;
      --face-top: #0c0c0e;
      --face-mid: #131315;
      --face-bot: #1d1d20;
      --ink: #f6f4f0;
      --pin: #fbfaf8;
      --rim: rgba(255, 255, 255, 0.05);
      --board-shadow: 0 46px 90px -40px rgba(0, 0, 0, 0.95),
                      0 0 0 1px rgba(255, 255, 255, 0.04);
    }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(130% 100% at 50% 6%, var(--wall-hi) 0%, var(--wall-hi) 34%, var(--wall-lo) 100%);
    background-color: var(--wall-hi);
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .clock {
    display: flex;
    gap: calc(var(--cell) * 0.42);      /* 时:分 与 秒 之间留出冒号的位置 */
    padding: var(--pad);
    border-radius: calc(var(--cell) * 0.2);
    background: var(--board);
    box-shadow: var(--board-shadow);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .group {
    display: grid;
    grid-template-columns: repeat(8, var(--cell));
    grid-template-rows: repeat(3, var(--cell));
    gap: calc(var(--cell) * 0.08);
  }

  .group--sec { grid-template-columns: repeat(4, var(--cell)); }

  .face {
    position: relative;
    width: var(--cell);
    height: var(--cell);
    border-radius: 50%;
    background: radial-gradient(circle at 50% -22%,
      var(--face-top) 0%,
      var(--face-mid) 46%,
      var(--face-bot) 100%);
    box-shadow:
      inset 0 calc(var(--cell) * 0.02) calc(var(--cell) * 0.045) var(--rim),
      inset 0 calc(var(--cell) * -0.012) calc(var(--cell) * 0.03) rgba(255, 255, 255, 0.25),
      0 1px 0 rgba(255, 255, 255, 0.35);
  }

  .pivot {
    position: absolute;
    inset: 0;
    transform-origin: 50% 50%;
    transition: transform var(--turn-min) var(--ease);
    will-change: transform;
  }

  /* 秒位：每格只给 0.8s，转完停一下等下秒 */
  .face.fast .pivot { transition-duration: var(--turn-sec); }

  .hand {
    position: absolute;
    left: 50%;
    bottom: 50%;
    width: 9.4%;
    height: 47.5%;
    margin-left: -4.7%;
    border-radius: 999px;
    background: var(--ink);
  }

  .pin {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 8%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: var(--pin);
  }

  /* 首帧和从前台切回来时：不要过渡，直接落位（放在 .fast 规则之后才压得住它） */
  .clock.boot .pivot,
  .clock.no-anim .pivot { transition: none; }

  @media (prefers-reduced-motion: reduce) {
    :root { --turn-min: 300ms; --turn-sec: 120ms; }
  }
</style>
</head>
<body>
  <main class="clock boot" id="clock" role="img" aria-label="ClockClock">
    <div class="group" id="hhmm"></div>
    <div class="group group--sec" id="ss"></div>
  </main>

<script>
(() => {
  'use strict';

  // One digit = 2 clocks wide × 3 clocks tall = 6 clocks = 12 hands.
  // A clock only holds two hands, so a glyph never makes a three-way
  // junction: strokes that would need one keep an open half-stem.
  // Angles: 0 = 12 o'clock, 90 = 3 o'clock, clockwise.
  const N = 0, E = 90, S = 180, W = 270, SW = 225;
  const GLYPHS = [
    [[E, S], [S, W], [N, S], [N, S], [N, E], [N, W]], // 0
    [[SW, SW], [S, S], [SW, SW], [N, S], [SW, SW], [N, N]], // 1
    [[E, E], [S, W], [E, S], [N, W], [N, E], [W, W]], // 2
    [[E, E], [S, W], [E, E], [N, W], [E, E], [N, W]], // 3
    [[S, S], [S, S], [N, E], [S, W], [SW, SW], [N, N]], // 4
    [[E, S], [W, W], [N, E], [S, W], [E, E], [N, W]], // 5
    [[E, S], [W, W], [N, S], [S, W], [N, E], [N, W]], // 6
    [[E, E], [S, W], [SW, SW], [N, S], [SW, SW], [N, N]], // 7
    [[E, S], [S, W], [N, E], [N, W], [N, E], [N, W]], // 8
    [[E, S], [S, W], [N, E], [N, S], [E, E], [N, W]]  // 9
  ];

  const ROWS = 3, COLS_MAIN = 8, COLS_SEC = 4;
  const FACES = COLS_MAIN * ROWS + COLS_SEC * ROWS;   // 24 + 12
  const clock = document.getElementById('clock');
  const pivots = [];

  function buildFace(host, fast) {
    const face = document.createElement('div');
    face.className = fast ? 'face fast' : 'face';
    const pair = [0, 1].map(() => {
      const pivot = document.createElement('div');
      pivot.className = 'pivot';
      pivot.appendChild(Object.assign(document.createElement('i'), { className: 'hand' }));
      face.appendChild(pivot);
      return pivot;
    });
    face.appendChild(Object.assign(document.createElement('b'), { className: 'pin' }));
    host.appendChild(face);
    pivots.push(pair);
  }

  const hhmm = document.getElementById('hhmm');
  const ss = document.getElementById('ss');
  for (let i = 0; i < COLS_MAIN * ROWS; i++) buildFace(hhmm, false);
  for (let i = 0; i < COLS_SEC * ROWS; i++) buildFace(ss, true);

  // clock index for every digit/clock slot, per group: row-major, 2 columns per digit
  const faceMap = [];
  for (let d = 0; d < 4; d++) {
    const slots = [];
    for (let k = 0; k < 6; k++) slots.push(((k / 2) | 0) * COLS_MAIN + d * 2 + (k % 2));
    faceMap.push(slots);
  }
  for (let d = 4; d < 6; d++) {
    const slots = [];
    for (let k = 0; k < 6; k++) slots.push(COLS_MAIN * ROWS + ((k / 2) | 0) * COLS_SEC + (d - 4) * 2 + (k % 2));
    faceMap.push(slots);
  }

  const angle = new Float64Array(FACES * 2);

  function setDigits(hhmmss, from, to, spin) {
    for (let d = from; d <= to; d++) {
      const glyph = GLYPHS[Number(hhmmss[d])];
      const slots = faceMap[d];
      for (let k = 0; k < 6; k++) {
        const index = slots[k];
        for (let h = 0; h < 2; h++) {
          const slot = index * 2 + h;
          const current = ((angle[slot] % 360) + 360) % 360;
          let delta = ((glyph[k][h] - current) % 360 + 360) % 360;
          if (spin) delta += 360;      // 时分位每次换字都顺时针兜一整圈
          angle[slot] += delta;
          pivots[index][h].style.transform = `rotate(${angle[slot]}deg)`;
        }
      }
    }
  }

  const pad2 = (n) => String(n).padStart(2, '0');
  const stamp = (date) => pad2(date.getHours()) + pad2(date.getMinutes()) + pad2(date.getSeconds());
  const readable = (t) => `${t.slice(0, 2)}:${t.slice(2, 4)}:${t.slice(4, 6)}`;

  let minute = '';

  function paint(date, spin) {
    const time = stamp(date);
    if (time.slice(0, 4) !== minute) {
      minute = time.slice(0, 4);
      setDigits(time, 0, 3, spin);
      document.title = `${time.slice(0, 2)}:${time.slice(2, 4)}`;
    }
    setDigits(time, 4, 5, false);
    clock.setAttribute('aria-label', 'ClockClock ' + readable(time));
  }

  const params = new URLSearchParams(location.search);
  const frozen = params.get('at');
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  const paused = frozen && /^\d{4}(\d{2})?$/.test(frozen);

  // ?turn=<秒> 时分位换字时长，?tick=<秒> 秒位每格时长
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const turn = Number(params.get('turn'));
  const tick = Number(params.get('tick'));
  const root = document.documentElement.style;
  if (turn > 0) root.setProperty('--turn-min', clamp(turn, 0.3, 60) + 's');
  if (tick > 0) root.setProperty('--turn-sec', clamp(tick, 0.05, 5) + 's');

  let timer = 0;

  function schedule() {
    clearTimeout(timer);
    const wait = 1000 - new Date().getMilliseconds() + 6;
    timer = setTimeout(() => {
      paint(new Date(), !still.matches);
      schedule();
    }, wait);
  }

  if (paused) {
    // static frame for screenshots: no transition at all
    const t = frozen.length === 4 ? frozen + '00' : frozen;
    minute = t.slice(0, 4);
    setDigits(t, 0, 5, false);
    document.title = `${t.slice(0, 2)}:${t.slice(2, 4)}`;
    clock.setAttribute('aria-label', 'ClockClock ' + readable(t));
  } else {
    // boot: 秒位先落位，时分位从 12 点慢慢扫到当前时间
    const now = new Date();
    setDigits(stamp(now), 4, 5, false);
    requestAnimationFrame(() => {
      clock.classList.remove('boot');
      requestAnimationFrame(() => {
        paint(new Date(), !still.matches);
        schedule();
      });
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clearTimeout(timer);
      } else {
        // 切回前台直接落位，别又转十几秒才读得出时间
        clock.classList.add('no-anim');
        paint(new Date(), false);
        void clock.offsetWidth;
        requestAnimationFrame(() => clock.classList.remove('no-anim'));
        schedule();
      }
    });
  }
})();
</script>
</body>
</html>
